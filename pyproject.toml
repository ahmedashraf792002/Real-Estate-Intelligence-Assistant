[project]
name = "darglobal-chatbot"
version = "0.3.0"
description = "RAG chatbot over DarGlobal and Wasalt data (Supabase Postgres + OpenRouter)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "numpy>=1.26",
    "fastembed>=0.3",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
# uv sync --group scrape --group dev
scrape = ["playwright>=1.44"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
